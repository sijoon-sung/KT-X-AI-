   <g id="text_1">
    <text style="font-weight: 700; font-size: 34px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="44.64" y="53.633125" transform="rotate(-0 44.64 53.633125)">타슈는 10분 뒤를 어떻게 예상할까?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 21px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="46.08" y="86.053125" transform="rotate(-0 46.08 86.053125)">주변 흐름을 읽고, 빌리고 돌려줄 대수를 예상해 여러 미래를 만듭니다.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="59.04" y="186.465703" transform="rotate(-0 59.04 186.465703)">입력 자료</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(59.04 202.520078)">이용 기록과</text>
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(59.04 237.205156)">주변 상황</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(59.04 304.801797)">지난 대여·반납 기록</text>
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(59.04 330.301797)">날씨·요일·시간</text>
   </g>
   <g id="text_6">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="318.24" y="185.960625" transform="rotate(-0 318.24 185.960625)">1  GCN · 상황 정리(encoder)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="318.24" y="219.921016" transform="rotate(-0 318.24 219.921016)">주변 대여소도 함께 보기</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(318.24 304.801797)">연결된 대여소의 흐름을</text>
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(318.24 330.368203)">한 대여소의 상황과 함께 정리</text>
   </g>
   <g id="text_9">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="627.84" y="186.465703" transform="rotate(-0 627.84 186.465703)">2  포아송 평균</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="627.84" y="219.770078" transform="rotate(-0 627.84 219.770078)">대여·반납 대수 예상</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(627.84 304.801797)">대여·반납이 각각</text>
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(627.84 330.301797)">평균적으로 얼마나 생길까?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="937.44" y="185.312578" transform="rotate(-0 937.44 185.312578)">3  Flow Matching · 미래 생성(decoder)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(937.44 202.671016)">가능한 미래를</text>
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(937.44 237.020078)">여러 개 만들기</text>
   </g>
   <g id="text_14">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(937.44 304.868203)">주변 상황과 예상 평균을 보고</text>
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; fill: #18353c" transform="translate(937.44 330.301797)">대여·반납의 여러 가능성을 생성</text>
   </g>
   <g id="text_15">
    <text style="font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #577078" x="761.76" y="114.19125" transform="rotate(-0 761.76 114.19125)">GCN이 정리한 주변 상황도 FM에 전달</text>
   </g>
   <g id="text_16">
    <text style="font-size: 14px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="1108.8" y="386.962656" transform="rotate(-0 1108.8 386.962656)">시작: Gaussian 잡음</text>
   </g>
   <g id="text_17">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="59.04" y="449.265703" transform="rotate(-0 59.04 449.265703)">현재 상태 · 재고 API</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="59.04" y="482.570078" transform="rotate(-0 59.04 482.570078)">지금 남은 자전거</text>
   </g>
   <g id="text_19">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="59.04" y="515.551797" transform="rotate(-0 59.04 515.551797)">가장 최근에 받은 재고</text>
   </g>
   <g id="text_20">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="627.84" y="449.324297" transform="rotate(-0 627.84 449.324297)">예측 결과</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="627.84" y="482.104688" transform="rotate(-0 627.84 482.104688)">10분 뒤 남을 자전거와, 자전거가 없을 가능성</text>
   </g>
   <g id="text_22">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="627.84" y="515.551797" transform="rotate(-0 627.84 515.551797)">지금 대수 + 예상 반납 - 예상 대여  →  여러 재고 표본</text>
   </g>
   <g id="text_23">
    <text style="font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #577078" x="432" y="471.24875" transform="rotate(-0 432 471.24875)">현재 재고는 마지막 계산에 반영</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="43.2" y="606.736719" transform="rotate(-0 43.2 606.736719)">이 결과를 서비스에서 어떻게 쓸까?</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="46.8" y="649.424688" transform="rotate(-0 46.8 649.424688)">부족할 곳 찾기</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="324" y="649.227031" transform="rotate(-0 324 649.227031)">이동 대수·방문 순서 계산</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #18353c" x="756" y="649.227031" transform="rotate(-0 756 649.227031)">외부 LLM이 쉬운 말로 설명</text>
   </g>
   <g id="text_28">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #577078" x="46.8" y="694.223359" transform="rotate(-0 46.8 694.223359)">예측 모델은 고정합니다. 새 재고가 오면 다시 예측합니다. LLM은 예측값을 바꾸지 않습니다.</text>
   </g>
  </g>
 </g>
