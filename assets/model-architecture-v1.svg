<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#508571" stroke-width="1.5"/></marker><style>text{font-family:'Malgun Gothic',Arial,sans-serif;fill:#173b32}.sub{font-size:15px;fill:#63776c}.title{font-size:21px;font-weight:700}.small{font-size:13px;fill:#63776c}.mono{font-family:Consolas,monospace;font-size:15px}.tag{font-size:12px;letter-spacing:1px;fill:#08765b;font-weight:700}.box{fill:white;stroke:#cddccf;stroke-width:1.4}.arrow{fill:none;stroke:#508571;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1440" height="980" fill="#f5f7f3"/><text x="55" y="55" class="tag">TASHU / FIXED ARCHITECTURE V1 / H13</text><text x="55" y="108" style="font-size:35px;font-weight:700">Encoder → Count decoder → Inventory</text><text x="55" y="141" class="sub">입력 특징 고정 · 10분 후 대여·반납을 생성하고 현재 재고와 결합한다.</text>
<rect x="45" y="184" width="425" height="568" rx="15" fill="#edf3ed" stroke="#d6e2d5"/><text x="65" y="217" class="tag">ENCODER</text><rect x="65" y="239" width="385" height="115" rx="9" class="box"/><text x="85" y="270" class="title">주간 프로필 표현</text><text x="85" y="299" class="mono">N×420 → 256 → 64</text><text x="85" y="329" class="small">SiLU · LayerNorm / 과거 프로필</text><path d="M255 355V382" class="arrow"/><rect x="65" y="389" width="385" height="96" rx="9" class="box"/><text x="85" y="420" class="title">고정 OD 관계 집계</text><text x="85" y="452" class="mono">z:N×64 / A·z:N×64</text><path d="M255 486V510" class="arrow"/><rect x="65" y="516" width="385" height="210" rx="9" class="box"/><text x="85" y="549" class="title">현재 조건 결합</text><text x="85" y="581" class="mono">자기164 → 256</text><text x="85" y="610" class="mono">이웃72 → 256 / 합산 + SiLU</text><text x="85" y="640" class="mono">Linear256 → 256 + SiLU ×2</text><text x="85" y="675" class="title">조건 h:B×256</text><text x="85" y="704" class="small">기존 달력·기상·최근 변화만 사용</text>
<rect x="500" y="184" width="465" height="568" rx="15" fill="#f0f4ed" stroke="#d6e2d5"/><text x="520" y="217" class="tag">COUNT DECODER / RENTAL, RETURN</text><rect x="520" y="239" width="425" height="115" rx="9" class="box"/><text x="540" y="270" class="title">평균 decoder</text><text x="540" y="299" class="mono">Linear256 → 2 / λ = prior·exp(2tanh(a/2))</text><text x="540" y="329" class="small">포아송 경로는 λ에서 별도 표집</text><path d="M470 620H488V297H518" class="arrow"/><path d="M735 355V381" class="arrow"/><rect x="520" y="389" width="425" height="337" rx="9" class="box"/><text x="540" y="422" class="title">조건부 Flow Matching</text><text x="540" y="457" class="mono">입력: h256 + log1p(λ)2</text><text x="540" y="485" class="mono">       + 잔차2 + 시간4 = 264</text><text x="540" y="525" class="mono">v:264 → 128 → 128 → 128 → 2</text><text x="540" y="565" class="mono">Gaussian 잔차 → Heun16</text><text x="540" y="601" class="mono">log 잔차 → 0 이상 정수 건수</text><text x="540" y="641" class="title">대여·반납 표본:B×128×2</text><text x="540" y="675" class="small">시드11·29를 표본마다 독립 선택</text><text x="540" y="703" class="small">독립 Gaussian 결합 / 도시 공동분포 아님</text>
<rect x="1000" y="184" width="395" height="568" rx="15" fill="#f6f2e8" stroke="#e3dbc5"/><text x="1020" y="217" class="tag">INVENTORY / DISPATCH</text><rect x="1020" y="239" width="355" height="115" rx="9" class="box"/><text x="1040" y="270" class="title">현재 API 재고</text><text x="1040" y="300" class="mono">b_now:B</text><text x="1040" y="329" class="small">추론 시작 상태 / 학습 정답 아님</text><path d="M1195 355V383" class="arrow"/><rect x="1020" y="389" width="355" height="170" rx="9" class="box"/><text x="1040" y="422" class="title">재고 표본으로 변환</text><text x="1040" y="459" class="mono">max(0,현재 + 반납 − 대여)</text><text x="1040" y="495" class="mono">B×128 → 중앙값·범위·0대 확률</text><text x="1040" y="533" class="small">상한 주차용량·사건 순서 복원은 미포함</text><path d="M946 642H980V475H1018" class="arrow"/><path d="M1195 560V586" class="arrow"/><rect x="1020" y="593" width="355" height="133" rx="9" class="box"/><text x="1040" y="625" class="title">H21 재배치 계산기</text><text x="1040" y="660" class="sub">수거·배치 수량 / 방문 순서</text><text x="1040" y="693" class="small">차량·작업 가정 / 신경망 밖의 계산</text>
<rect x="45" y="787" width="1350" height="92" rx="10" fill="white" stroke="#dce5de"/><text x="65" y="817" class="tag">TRAINING ORDER</text><text x="65" y="851" class="sub">과거 서울 encoder 초기화 → 타슈 GCN·평균 head 학습 → 예측망 고정·FM 학습 → 가중치 잠금 후 API 평가</text><text x="55" y="919" class="small">H22 비교 모델: 조건 h1280, 은닉4개층, FM 조건망1280×3→128 캐시, 속도장136→128→128→128→2. 입력 종류는 동일.</text><text x="55" y="947" class="small">현재 코드 명세. 새 학습·새 정확도 평가를 수행한 구조도가 아니다. N: 전체 대여소 / B: 배치의 대여소·시각 수.</text></svg>
