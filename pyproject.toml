[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tashu-contest"
version = "0.1.0"
description = "Reproducible bike stock forecasts and budgeted transfer recommendations"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "torch>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tashu = "tashu_contest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
