name: Contest pipeline checks
on:
  push:
    branches: [main, 'contest/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cpu-py312.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
