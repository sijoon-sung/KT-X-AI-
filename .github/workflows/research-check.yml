name: Research protocol
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: research-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check record tooling
        run: python -m unittest discover -s tools/tests -v
      - name: Validate all records
        run: python tools/research.py check
      - name: Validate PR scope and frozen plans
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
        run: python tools/research.py check --base-ref "$PR_BASE" --pr-title "$PR_TITLE" --draft "$PR_DRAFT"
